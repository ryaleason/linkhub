        :root {
            --purple-light: #a855f7;
            --purple-dark: #7e22ce;
            --bg-light: #f9fafb;
            --bg-dark: #111111;
            --text-light: #1f2937;
            --text-dark: #f3f4f6;
        }

        body {
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .dark {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .light {
            background-color: var(--bg-light);
            color: var(--text-light);

        /* Base styles for link card - keeping your existing styles */
/* Base styles for link card - keeping your existing styles */
.link-card:hover,
.link-card-active {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.4);
}

.link-card::before,
.link-card-active {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, var(--purple-light), var(--purple-dark));
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: -1;
}

.link-card:hover::before,
.link-card-active {
    opacity: 0.2;
}

/* Container for product images */
.link-card-container {
    position: relative;
    overflow: visible;
}

/* Horizontal scrolling container */
.product-images-container {
    max-height: 0;
    opacity: 0;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    transform: translateY(-20px);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    margin-top: 8px;
    padding-bottom: 8px; /* Space for scrollbar */
    scrollbar-width: thin;
    scrollbar-color: rgba(168, 85, 247, 0.5) transparent;
}

/* Scrollbar styling */
.product-images-container::-webkit-scrollbar {
    height: 6px;
}

.product-images-container::-webkit-scrollbar-track {
    background: transparent;
}

.product-images-container::-webkit-scrollbar-thumb {
    background-color: rgba(168, 85, 247, 0.5);
    border-radius: 6px;
}

/* Show the container on hover */
.link-card-container:hover .product-images-container {
    max-height: 200px;
    opacity: 1;
    transform: translateY(0);
}

/* Individual product image styling */
.product-image {
    display: inline-block !important;
    width: 200px;
    margin-right: 10px;
    border-radius: 8px;
    overflow: hidden;
    transition: transform 0.3s ease;
}

.product-image:last-child {
    margin-right: 0;
}

.product-image:hover {
    transform: translateY(-5px);
}

/* Add a subtle shine effect that moves across the images */
.product-image {
    position: relative;
}

.product-image::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0) 100%
    );
    transform: skewX(-25deg);
    transition: all 0s;
    opacity: 0;
}

.product-image:hover::after {
    left: 150%;
    opacity: 1;
    transition: all 1s ease;
}

        .theme-toggle {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: rotate(30deg);
        }

        .avatar {
            border: 4px solid var(--purple-light);

/* Animation styles for the product image */

.product-image2 {

/* Add a subtle bounce effect */
@keyframes slight-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }

.link-card-container2:hover .product-image2 img {
    animation: slight-bounce 1.5s ease infinite;

/* Add a nice reveal effect on the image */

    transform-origin: top;

    <script>
        const linkcard =document.querySelector('.link-card-container');
        const body = document.querySelector('body');
        const themeToggle = document.querySelector('.theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        
        if (savedTheme === 'dark') {
            body.classList.remove('light');
            body.classList.add('dark');
            themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />`;
        }


        document.querySelectorAll('.link-card-container').forEach(linkcard => {
    linkcard.addEventListener('click', () => {
        const card = linkcard.querySelector('.link-card');
        const imagesContainer = linkcard.querySelector('.product-images-container');

        // Toggle active class for persistent effect
        card.classList.toggle('link-card-active');

        // Toggle visibility of images
        if (imagesContainer) {
            if (imagesContainer.style.maxHeight === '0px' || !imagesContainer.style.maxHeight) {
                imagesContainer.style.opacity = '1';
                imagesContainer.style.maxHeight = '200px';
                imagesContainer.style.transform = 'translateY(0)';
            } else {
                imagesContainer.style.opacity = '0';
                imagesContainer.style.maxHeight = '0px';
                imagesContainer.style.transform = 'translateY(-20px)';
                
                // Don't remove the active class here to maintain the toggle effect
            }
        }
    });
});

        
        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                localStorage.setItem('theme', 'light');
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />`;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('.avatar', {
                y: 30,
                opacity: 0,
                duration: 1,
                ease: 'power3.out'
            });
            
            gsap.from('h1, p', {
                y: 20,
                opacity: 0,
                duration: 0.8,
                stagger: 0.2,
                ease: 'power3.out',
                delay: 0.4
            });
            
            gsap.from('.social-icon', {
                y: 10,
                opacity: 0,
                duration: 0.5,
                stagger: 0.1,
                ease: 'power3.out',
                delay: 0.8
            });
            
            gsap.from('.link-card', {
                y: 20,
                opacity: 0,
                duration: 0.7,
                stagger: 0.15,
                ease: 'power3.out',
                delay: 1
            });
            
            const linkCards = document.querySelectorAll('.link-card');
            
            linkCards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    gsap.to(card, {
                        scale: 1.02,
                        y: -5,
                        boxShadow: '0 10px 25px -5px rgba(168, 85, 247, 0.4)',
                        duration: 0.3
                    });
                });
                
                card.addEventListener('mouseleave', () => {
                    gsap.to(card, {
                        scale: 1,
                        y: 0,
                        boxShadow: 'none',
                        duration: 0.3
                    });
                });
            });
        });
    </script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const linkCardContainers = document.querySelectorAll('.link-card-container');
            
            linkCardContainers.forEach(container => {
                const linkCard = container.querySelector('.link-card');
                const productImage = container.querySelector('.product-image');
                
                linkCard.addEventListener('mouseenter', () => {
                    productImage.classList.remove('hidden');
                });
                
                linkCard.addEventListener('mouseleave', () => {
                    productImage.classList.add('hidden');
                });
            });
        });
    </script>
</body>
</html>
